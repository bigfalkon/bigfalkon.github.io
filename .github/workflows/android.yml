name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'
    paths-ignore:
      - 'android/**.md'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'APK için Release oluştur (telefondan indirilebilir link)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - uses: gradle/actions/setup-gradle@v4

      # İsteğe bağlı: kendi imza anahtarını secret olarak eklersen o kullanılır,
      # eklemezsen repodaki keystore/sideload.jks ile imzalanır.
      - name: Restore signing key from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/signing.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/signing.jks" >> "$GITHUB_ENV"
          echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build release APK
        working-directory: android
        env:
          ORG_GRADLE_PROJECT_versionCodeOverride: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk \
             "dist/karakter-evreni-${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: karakter-evreni-apk
          path: dist/*.apk
          if-no-files-found: error

      # Feature branch'lerde de release yayınla: "Run workflow" düğmesi ancak workflow
      # main'e girdikten sonra göründüğü için, APK'ya telefondan erişebilmenin tek kolay yolu.
      - name: Publish release
        if: >-
          ${{ (github.event_name == 'workflow_dispatch' && inputs.publish_release)
              || startsWith(github.ref, 'refs/heads/claude/') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: Karakter Evreni APK v${{ github.run_number }}
          prerelease: ${{ startsWith(github.ref, 'refs/heads/claude/') }}
          body: |
            Telefondan aşağıdaki `.apk` dosyasına dokunup kurabilirsin
            (Android "bilinmeyen kaynaklardan kuruluma izin ver" diye sorabilir).

            Branch: `${{ github.ref_name }}`
            Commit: ${{ github.sha }}
          files: dist/*.apk
